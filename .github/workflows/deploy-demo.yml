name: Deploy Interactive Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Pinned, prebuilt — same as tests.yml. An unpinned `cargo install
      # wasm-pack` builds whatever is newest from source, and wasm-pack 0.15.0
      # cannot be built at all (every `zip` version it requires is yanked).
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0

      - name: Build WASM package
        run: wasm-pack build crates/wasm --target web

      - name: Prepare demo site
        run: |
          mkdir -p _site/demo
          cp examples/interactivejs/index.html _site/demo/
          cp crates/wasm/pkg/rustcfml_wasm.js _site/demo/
          cp crates/wasm/pkg/rustcfml_wasm_bg.wasm _site/demo/
          cp crab.svg _site/demo/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
